<section class="work-panel"><div class="tabs"><button class="tab active" data-tab="tasks">할 일</button><button class="tab" data-tab="proc">주문·준비물</button><div class="tools"><input class="field" id="search" placeholder="할 일 찾기"><select class="field" id="scope"><option value="all">전체</option><option value="open">안 끝난 일</option><option value="p0">중요한 일</option></select><button class="btn" id="copy">안 끝난 일 복사</button><button class="btn" id="csv">파일로 받기</button></div></div><div class="detail" id="detail"></div><div class="task-area" id="taskArea">${phasesHtml()}<div class="empty" id="empty">찾은 내용이 없습니다.</div></div><div class="proc-wrap" id="procArea">${procHtml()}</div></section>
<details class="rules"><summary>꼭 지킬 것 보기</summary><ul>${rules}</ul></details>`;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
function update(){const done=data.tasks.filter(t=>isDone(t.id)).length,total=data.tasks.length;document.getElementById('ratio').textContent=`${done} / ${total}`;document.getElementById('bar').style.width=Math.round(done/total*100)+'%';data.phases.forEach(p=>{const ts=data.tasks.filter(t=>t.phase===p.id),d=ts.filter(t=>isDone(t.id)).length;const el=document.querySelector(`[data-count="${p.id}"]`);if(el)el.textContent=`${d}/${ts.length}`})}
function filter(){const q=document.getElementById('search').value.trim().toLowerCase(),scope=document.getElementById('scope').value;let n=0;document.querySelectorAll('.task-row').forEach(r=>{const t=taskMap[r.dataset.task],okQ=!q||r.dataset.search.includes(q),okS=scope==='all'||(scope==='open'&&!isDone(t.id))||(scope==='p0'&&t.priority==='P0');const show=okQ&&okS;r.classList.toggle('hidden',!show);if(show)n++});document.querySelectorAll('.phase').forEach(p=>p.style.display=p.querySelector('.task-row:not(.hidden)')?'block':'none');document.getElementById('empty').style.display=n?'none':'block'}
function showTask(t){const d=document.getElementById('detail');d.innerHTML=`<h3>${esc(t.title)}</h3><p>${esc(t.detail)}</p><p><b>누가</b> ${esc(t.owner)} · <b>언제까지</b> ${esc(t.due)} · <b>끝나면 남길 것</b> ${esc(t.proof)}</p>`;d.classList.add('open')}
document.querySelectorAll('[data-cal]').forEach(b=>b.addEventListener('click',()=>{const [date,label]=b.dataset.cal.split('|'),e=data.calendar.find(x=>x.date===date&&x.label===label),d=eventDetail(e);document.getElementById('selTitle').textContent=`${date.slice(5).replace('-','/')} · ${d.title}`;document.getElementById('selBody').textContent=d.lines;document.getElementById('selection').classList.add('open')}));
document.getElementById('selClose').addEventListener('click',()=>document.getElementById('selection').classList.remove('open'));
document.querySelectorAll('[data-check]').forEach(c=>c.addEventListener('change',e=>{state[e.target.dataset.check]=e.target.checked;save();e.target.closest('.task-row').classList.toggle('done',e.target.checked);update();filter()}));
document.querySelectorAll('.task-row').forEach(r=>r.addEventListener('click',e=>{if(e.target.matches('input'))return;showTask(taskMap[r.dataset.task])}));
document.querySelectorAll('[data-proc]').forEach(c=>c.addEventListener('change',e=>{state['proc:'+e.target.dataset.proc]=e.target.checked;save()}));
document.getElementById('search').addEventListener('input',filter);document.getElementById('scope').addEventListener('change',filter);
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));const p=b.dataset.tab==='proc';document.getElementById('taskArea').style.display=p?'none':'block';document.getElementById('procArea').style.display=p?'block':'none';document.getElementById('detail').classList.remove('open');if(p)history.replaceState(null,'','#proc');else history.replaceState(null,'',location.pathname)}));
if(location.hash==='#proc')document.querySelector('[data-tab="proc"]').click();
document.getElementById('copy').addEventListener('click',async()=>{const text=data.tasks.filter(t=>!isDone(t.id)).map(t=>`[ ] ${t.due} · ${t.owner} · ${t.title}`).join('\n');try{await navigator.clipboard.writeText(text)}catch{const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('안 끝난 일을 복사했습니다.')});
document.getElementById('csv').addEventListener('click',()=>{const rows=[['단계','할 일','언제까지','담당','현재 상태','체크'],...data.tasks.map(t=>[phaseMap[t.phase]?.name,t.title,t.due,t.owner,t.status,isDone(t.id)?'완료':'안 끝남'])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='club-serkan-event-checklist.csv';a.click();URL.revokeObjectURL(a.href)});
update();filter();
</script>
</body>
</html>
